# Mock run: exercises the whole pipeline in seconds with the scripted MockProvider.
# No model, no network. The numbers it produces are SIMULATED and say nothing about real models.
# Run with:  python -m bench.run --config config.mock.yaml

app:
  canary: CANARY-7f3a91
  marker: PWNED-4471
  lab_key: 279cf67a6a46926b12da88c642df9d0d
  corpus_sha256: 497b81f54008cd52896a0dfd726178711055b6857d7e2ac39fa07b0ce690c734

paths:
  attacks_dir: attacks
  benign_file: data/benign_tasks.yaml
  results_dir: results/mock
  cache_dir: null          # the mock is instant; no cache needed

run:
  max_calls: null
  max_consecutive_errors: 10

defaults:
  trials: 5
  temperature: 0.7
  base_seed: 1000
  max_tokens: 200
  timeout_seconds: 5
  seconds_per_call_estimate: 0.001
  defenses: [D0, D1, D2, D3, D4, D5, D6, D7]

models:
  - name: mock-gullible
    provider: mock
    model: mock-gullible
    options: {compliance: 0.6, summary_words: 40}

  - name: mock-cautious
    provider: mock
    model: mock-cautious
    trials: 3
    defenses: [D0, D2, D4, D5, D6, D7]
    options: {compliance: 0.2, summary_words: 40}

reports:
  - name: cyb240
    title: "CYB 240 (simulated): prompt injection attacks and low-cost defenses"
    defenses: [D0, D1, D2, D3, D4]
  - name: cyb220
    title: "CYB 220 (simulated): cryptography-inspired defenses against prompt injection"
    defenses: [D0, D1, D2, D3, D4, D5, D6, D7]
    new_defenses: [D5, D6, D7]
